version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Bugs
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forcetypeassert
    - gosec
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
    # Style and simplicity
    - copyloopvar
    - dupword
    - errname
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godot
    - intrange
    - misspell
    - modernize # prefer the generic stdlib: slices, maps, min/max
    - nakedret
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - whitespace
    # Tests
    - thelper
    - tparallel
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam # protobuf and store types are passed by value on purpose
        - unnamedResult
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow # err shadowing is idiomatic
    misspell:
      locale: UK
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,testing.TB"
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: strict
    paths:
      - internal/gen
      - reference

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/edevhub/crawly
  exclusions:
    generated: strict
    paths:
      - internal/gen
