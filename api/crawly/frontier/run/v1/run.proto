// Crawly Frontier API: runs (scheduler API).
//
// Run termination: a run COMPLETES when it is sealed AND it has no pending, delayed or
// in-flight tasks. It ends early in one of three ways, and the remaining tasks are dropped
// in each of them (counted as expired for the first, as cancelled for the other two):
//   - EXPIRED: its deadline is reached.
//   - CANCELLED: an operator or scheduler called CancelRun.
//   - ABORTED: one of the rules of RunLimits (abort_on_codes, max_failed,
//     max_consecutive_failures) tripped. The Frontier ends the run in the same
//     transaction that applies the outcome; Run.abort_reason says which rule and which
//     task. A run that is already over is not aborted, so a run has one reason at most.
// Leases of the dropped tasks are revoked in all three cases.

syntax = "proto3";

package crawly.frontier.run.v1;

import "crawly/frontier/policy/v1/policy.proto";
import "crawly/frontier/task/v1/task.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/edevhub/crawly/internal/gen/frontier/run/v1;runv1";

message Run {
  string run_id = 1;
  reserved 2, 8, 10;
  map<string, string> labels = 3;

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_OPEN = 1;        // accepting seeds and dispatching
    STATE_SEALED = 2;      // no more seeds; dispatching until drained
    STATE_COMPLETED = 3;   // sealed and drained
    STATE_CANCELLED = 4;
    STATE_EXPIRED = 5;     // deadline reached; remaining tasks were dropped
    STATE_ABORTED = 6;     // a rule of RunLimits tripped; remaining tasks were dropped (see abort_reason)
  }
  State state = 4;
  bool paused = 5;

  crawly.frontier.policy.v1.RunPolicy policy = 6;
  RunLimits limits = 7;
  KeyRule key_rule = 9;
  // Field 11 (policy_version) removed: policies are static; attempts record the policy set.
  reserved 11;

  RunStats stats = 12;

  google.protobuf.Timestamp create_time = 13;
  google.protobuf.Timestamp seal_time = 14;
  google.protobuf.Timestamp finish_time = 15;

  // Why the run ended, when its state is ABORTED; unset otherwise.
  AbortReason abort_reason = 16;
}

// The rule that ended a run and the outcome that tripped it.
message AbortReason {
  enum Rule {
    RULE_UNSPECIFIED = 0;
    RULE_CODE = 1;                      // RunLimits.abort_on_codes
    RULE_MAX_FAILED = 2;                // RunLimits.max_failed
    RULE_MAX_CONSECUTIVE_FAILURES = 3;  // RunLimits.max_consecutive_failures
  }
  Rule rule = 1;
  // The code of the attempt that tripped the rule (empty when the attempt had none).
  string code = 2;
  // The task whose attempt tripped it.
  string task_id = 3;
}

message RunStats {
  // pending: tasks of backlogs whose next eligible time has passed; delayed: the rest of the
  // undispatched tasks. Approximate: eligibility is per (queue, run, pool) backlog and
  // includes politeness and queue blocks as well as not_before_time and backoff.
  uint64 pending = 1;
  uint64 delayed = 2;
  uint64 in_flight = 3;
  uint64 succeeded = 4;
  uint64 failed = 5;
  uint64 expired = 6;     // dropped by TTL or run deadline
  uint64 attempts = 7;
  uint64 queue_blocks = 8;   // block_queue_for requests received
  uint64 discovered = 9;
  uint64 duplicates = 10;
  uint64 over_budget = 11;
  map<string, uint64> by_code = 12;
  // Dropped because the run was cancelled or aborted. Dropped by TTL or deadline: expired.
  uint64 cancelled = 13;
  // Queues that are blocked now and hold pending or delayed tasks of this run, so that
  // the run's tasks wait for them. At most 20 are listed, the ones with the most waiting
  // tasks first (ties by queue key); a run that waits on more has more than this list
  // shows. Empty for a run that has ended. Best effort: when it cannot be read the run
  // is returned without it. Lifecycle events (not STATS events) do not carry it.
  repeated BlockedQueue blocked_queues = 14;
}

// A blocked queue a run waits on.
message BlockedQueue {
  string queue_key = 1;
  google.protobuf.Timestamp unblock_time = 2;
  // The code of the outcome that blocked the queue, or the reason of an operator's block.
  string reason = 3;
  // Pending and delayed tasks of this run on the queue.
  uint64 waiting = 4;
}

// Safety net against crawler traps and runaway discovery. Link-following rules stay in the spider.
message RunLimits {
  // Hard stop. Remaining tasks expire and the run ends EXPIRED.
  google.protobuf.Timestamp deadline_time = 1;
  // Soft: batches are rejected once reached; concurrent batches may overshoot slightly.
  uint64 max_tasks = 2;
  uint32 max_depth = 3;
  // Rules that end the run as ABORTED (STATE_ABORTED). Each is checked in the transaction
  // that applies an attempt's outcome, so two workers that trip a rule at once give one
  // abort with one reason. 0 or empty: no such rule.
  //
  // An attempt that is recorded with one of these codes ends the run: a final failure, a
  // retry (the attempt that asks for a retry counts, whether or not attempts remain) and
  // a success alike. A task handed back unrun (released) records no attempt and never
  // counts. The queue block that comes with the outcome is applied before the run ends,
  // so a blocked site stays blocked. CreateRun rejects an empty code, a duplicate, more
  // than 64 codes and the codes "revoked" and "shutdown", which no recorded attempt
  // carries.
  repeated string abort_on_codes = 4;
  // The run ends when this many of its tasks have failed for good (no attempts left, or
  // a failure that is not retried). Retries, expiries and drops do not count, and neither
  // does a task whose last attempt ended because its lease expired: that is a failure of
  // the worker fleet, not of the site, and a fleet outage must not end the run. (A run
  // can still list the code lease_expired in abort_on_codes.)
  uint64 max_failed = 5;
  // The run ends when this many tasks have failed for good in a row. The order is the
  // order in which the Frontier applies outcomes of the run, one at a time: a task that
  // fails for good adds one, a task that succeeds resets the count to zero, and nothing
  // else (a retry, a release, an expiry, a lease that expired) changes it. Outcomes of tasks that run at the
  // same time count in the order they are applied, so with concurrent workers "in a row"
  // means in the order of application, not in the order the pages were fetched.
  uint32 max_consecutive_failures = 6;
}

message KeyRule {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_HOST = 1;          // default
    KIND_REGISTERED_DOMAIN = 2;
    KIND_EXPLICIT = 3;      // TaskSpec.queue_key is required
  }
  Kind kind = 1;
}

message RunEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_CREATED = 1;
    TYPE_SEALED = 2;
    TYPE_PAUSED = 3;
    TYPE_RESUMED = 4;
    TYPE_COMPLETED = 5;
    TYPE_CANCELLED = 6;
    TYPE_EXPIRED = 7;
    TYPE_STATS = 8;
    TYPE_ABORTED = 9;
  }
  Type type = 1;
  Run run = 2;
  google.protobuf.Timestamp event_time = 3;
}

message TaskStatus {
  crawly.frontier.task.v1.Task task = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PENDING = 1;
    STATE_DELAYED = 2;
    STATE_IN_FLIGHT = 3;
    STATE_SUCCEEDED = 4;
    STATE_FAILED = 5;
    STATE_EXPIRED = 6;
    STATE_CANCELLED = 7;   // the run was cancelled or aborted before the task finished
  }
  State state = 2;
  google.protobuf.Timestamp next_eligible_time = 3;
  repeated Attempt attempts = 4;
}

message Attempt {
  uint32 attempt = 1;
  string worker_id = 2;
  string worker_version = 3;
  google.protobuf.Timestamp dispatch_time = 4;
  google.protobuf.Timestamp finish_time = 5;
  crawly.frontier.task.v1.Outcome outcome = 6;
  crawly.frontier.task.v1.FetchInfo fetch = 7;
  // Hash of the policy set of the frontier replica that dispatched this attempt.
  string policy_set = 8;
}
